name: Core checks
on: [push, pull_request]
jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Submission isolation relies on the Node 26 permission model, so the
          # isolation tests are real only here. Node 22 could not have passed
          # them: it would have failed, or worse, reported a refusal as a grade.
          node-version: '26'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm test
      - run: npm run check
