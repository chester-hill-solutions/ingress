# Draft rollout: Only product/package-lock.json has a third-party runtime tool dependency. The dependency-free root probe and opt-in real-model trials stay unchanged.
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/product"
    schedule:
      interval: weekly
      day: tuesday
      time: "09:30"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 2
    cooldown:
      default-days: 7
    groups:
      react-router:
        applies-to: version-updates
        patterns:
          - "react-router"
          - "@react-router/*"
        update-types: [minor, patch]
      react:
        applies-to: version-updates
        patterns:
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
        update-types: [minor, patch]
      better-auth:
        applies-to: version-updates
        patterns:
          - "better-auth"
          - "@better-auth/*"
        update-types: [minor, patch]
      test-tools:
        applies-to: version-updates
        patterns:
          - "vitest"
          - "@vitest/*"
        update-types: [minor, patch]
      vite-worker-tools:
        applies-to: version-updates
        patterns:
          - "vite"
          - "@vitejs/*"
          - "@cloudflare/vite-plugin"
          - "wrangler"
          - "miniflare"
          - "@cloudflare/workers-types"
        update-types: [minor, patch]
      aws-sdk:
        applies-to: version-updates
        patterns:
          - "@aws-sdk/*"
        update-types: [minor, patch]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: monthly
      time: "09:30"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 1
    groups:
      actions:
        applies-to: version-updates
        patterns: ["*"]
        update-types: [minor, patch]
